<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Chalo Dekhe Bharat! — Your Interactive Passport to Incredible India. Explore, Experience, Collect, and Travel across India's rich heritage through a digital passport journey." />
    <meta name="theme-color" content="#FF6B2B" />

    <!-- Strict Content Security Policy -->
    <!-- TODO(security): Move CSP to server-side headers before production deployment.
         Current meta-tag CSP is a defense-in-depth measure; server-side CSP is authoritative. -->
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://*.clerk.accounts.dev https://challenges.cloudflare.com https://*.protect.clerk.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: https://img.clerk.com; connect-src 'self' http://localhost:3001 https://*.clerk.accounts.dev wss://*.clerk.accounts.dev https://*.protect.clerk.com; worker-src 'self' blob:; frame-src 'self' https://*.clerk.accounts.dev https://challenges.cloudflare.com https://*.protect.clerk.com; frame-ancestors 'none'; object-src 'none';" />

    <!-- Google Fonts: Inter + Outfit -->
    <!-- NOTE: Loaded from Google CDN. Pin exact version via URL params; update periodically. -->
    <!-- TODO(security): Add SRI hashes once font URLs are stabilized for production. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <title>Chalo Dekhe Bharat! — Your Interactive Passport to Incredible India</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
